name: BLI preflight

# Fast beacon-only gate for the submission branch — complements the broader
# `main.yml` suite (which runs the whole repo and only fires on main) by
# giving `hackathon/bli-mandate-beacon` a push-triggered check that lands in
# minutes, not tens of minutes.
#
# Three jobs run in parallel; any failure keeps the branch red:
#   - solidity-tests    hardhat test for the 3 beacon contracts (26 cases)
#   - inspector-preflight    sync-manifest + typecheck + vite build
#   - cre-typecheck    tsc --noEmit on cre/ (the Chainlink CRE workflow)
#
# Guards the two most common regression classes:
#   (a) a contract edit that silently breaks another mechanism's invariant
#   (b) a chain-manifest refresh that forgets to re-ship the inspector dist

on:
  push:
    branches:
      - hackathon/bli-mandate-beacon
    paths:
      - "contracts/beacon/**"
      - "test/beacon/**"
      - "scripts/beacon/**"
      - "beacon/**"
      - "cre/**"
      - "hardhat.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/bli-preflight.yml"
  pull_request:
    branches:
      - hackathon/bli-mandate-beacon
      - main
    paths:
      - "contracts/beacon/**"
      - "test/beacon/**"
      - "scripts/beacon/**"
      - "beacon/**"
      - "cre/**"
      - "hardhat.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/bli-preflight.yml"
  workflow_dispatch:

concurrency:
  group: bli-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  solidity-tests:
    name: Hardhat · 26 beacon tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: "false"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Compile beacon contracts
        run: npx hardhat compile
      - name: MandateAnchor + Sakk + Esusu (26 cases)
        run: >
          npx hardhat test
          test/beacon/MandateAnchor.ts
          test/beacon/SakkMandate.ts
          test/beacon/EsusuMandate.ts

  inspector-preflight:
    name: Inspector · sync + typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: "false"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: beacon/package-lock.json
      - name: Install inspector deps
        working-directory: beacon
        run: npm ci
      - name: Preflight (sync-manifest → tsc → vite build)
        working-directory: beacon
        run: npm run preflight

  cre-typecheck:
    name: CRE workflow · tsc --noEmit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Non-blocking: @chainlink/cre-sdk's EVMClient surface drifted between
    # the version cre/workflow.ts was written against and ^1.6.0 installed
    # today — getBlockNumber / getLogs / readContract are not on the
    # ClientCapability type as currently published. Documented as entry #10
    # in docs/WHAT_WE_GOT_WRONG_FIRST.md. The job runs to keep the signal
    # visible every push; it won't gate a merge until the SDK-call sites are
    # rewritten.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: "false"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
      - name: Install CRE deps
        working-directory: cre
        run: npm install
      - name: Typecheck (advisory)
        working-directory: cre
        run: npm run typecheck
